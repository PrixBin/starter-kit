<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="favicon-tecboard-dark.svg" type="image/svg+xml">
    <title>Tecboard - Cadastro</title>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="img/logo-tecboard-branco.png" alt="Logo Tecboard na cor branca">
        </a>
    </header>

    <main>
        <section id="cadastro">
            <h2>Solicite seu Acesso e Configure sua Aplicação</h2>

            <form action="#" method="post">
                            <fieldset>
                <legend>Dados do responsavel</legend>

           
                <label for="userName">Nome:</label>
                <input type="text" required>
                <br>

                <label for="userAge">Idade:</label>
                <input type="number" required min="12" max="100">
                <br>

                <label for="userBirthDate">Data de Nascimento:</label>
                <input type="date" name="userBirthDate" >
                <br>

                <label for="userEmail">Email Corporativo:</label>
                <input type="email" name="userEmail" required>
                <br>

                <label for="userPhoneNumber">Telefone Plantão:</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="123456789">
                <br>

                <label for="userImage">Upload de Foto</label>
                <input type="file" name="userImage" accept="image/*">
                <br>

            </fieldset> 
             <fieldset>

                <legend>Aplicação e preferências</legend>

                <label for="portedainfrastretura">Porte da infraestrutura</label>
                <input type="radio"button name="userGender" value="feminino">
                <label for="userGender">Pequeno</label>

                <input type="radio"button name="userGender" value="masculino">
                <label for="userGender">Medio</label>

                <input type="radio"button name="userGender" value="naoinformado">
                <label for="userGender">Corporativo</label>
                <br>

             

                <label for="userState">Estado da Sede</label>
                <select name="userState"required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceará">Ceará</option>    
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espíritoSanto">Espírito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pára</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>                      
                      


                </select>
                <br>

                 <label for="stackPrincipal">Stack Principal</label>
                    <input id="stackPrincipal" type="text" name="stackPrincipal" list="stackType">
                    <datalist id="stackType">
                        <option value="MERN Stack">
                        <option value="MEAN Stack">
                        <option value="Django / Python Stack">
                        <option value="Ruby">                        
                    </datalist>
                    <br>

                     
                <label for="canaisdealerta">Canais de Alerta</label>
                <input id="facebook" type="checkbox" name=" social" value="email">
                <label for="email">E-mail</label>

                <input type="checkbox" name="sms" value="instagram">
                <label for="sms">SMS</label>

                <br>



                

            </fieldset>

            </form>
        </section>
    </main>
</body>
</html>
